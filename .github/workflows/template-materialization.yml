name: Template Materialization

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-template-materialization:
    name: Validate template materialization
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install template
        run: dotnet new install ./content --force

      - name: Materialize PostgreSQL template
        run: dotnet new cleanapi -n Validation.PostgreSql --db PostgreSql -o /tmp/cleanapi-template-validation/postgresql --force

      - name: Materialize SQL Server template
        run: dotnet new cleanapi -n Validation.SqlServer --db SqlServer -o /tmp/cleanapi-template-validation/sqlserver --force

      - name: Validate provider-specific filenames are absent
        shell: bash
        run: |
          set -euo pipefail

          assert_no_provider_suffixes() {
            local project="$1"
            local label="$2"

            echo "Checking $label"

            findings="$({
              find "$project" -type f \( \
                -name "*.PostgreSql.cs" \
                -o -name "*.SqlServer.cs" \
                -o -name "PostgreSqlAspireDatabase.cs" \
                -o -name "SqlServerAspireDatabase.cs" \
              \) -print
            })"

            if [ -n "$findings" ]; then
              echo "$findings"
              exit 1
            fi
          }

          assert_no_provider_suffixes /tmp/cleanapi-template-validation/postgresql "PostgreSQL output"
          assert_no_provider_suffixes /tmp/cleanapi-template-validation/sqlserver "SQL Server output"

      - name: Validate neutral provider files exist
        shell: bash
        run: |
          set -euo pipefail

          assert_file_exists() {
            local file="$1"

            if [ ! -f "$file" ]; then
              echo "Expected file does not exist: $file"
              exit 1
            fi
          }

          assert_file_exists /tmp/cleanapi-template-validation/postgresql/src/aspire/Validation.PostgreSql.AppHost/Providers/AspireDatabase.cs
          assert_file_exists /tmp/cleanapi-template-validation/postgresql/src/Validation.PostgreSql.Infrastructure/Persistence/Providers/DatabaseProviderConfigurator.cs
          assert_file_exists /tmp/cleanapi-template-validation/postgresql/tests/Validation.PostgreSql.TestSupport/Database/TestDatabaseProvider.cs
          assert_file_exists /tmp/cleanapi-template-validation/postgresql/tests/Validation.PostgreSql.TestSupport/Database/TestDatabaseServer.cs

          assert_file_exists /tmp/cleanapi-template-validation/sqlserver/src/aspire/Validation.SqlServer.AppHost/Providers/AspireDatabase.cs
          assert_file_exists /tmp/cleanapi-template-validation/sqlserver/src/Validation.SqlServer.Infrastructure/Persistence/Providers/DatabaseProviderConfigurator.cs
          assert_file_exists /tmp/cleanapi-template-validation/sqlserver/tests/Validation.SqlServer.TestSupport/Database/TestDatabaseProvider.cs
          assert_file_exists /tmp/cleanapi-template-validation/sqlserver/tests/Validation.SqlServer.TestSupport/Database/TestDatabaseServer.cs

      - name: Validate authoring conditions are absent
        shell: bash
        run: |
          set -euo pipefail

          assert_no_authoring_conditions() {
            local project="$1"
            local label="$2"

            echo "Checking $label"

            if grep -RInE 'EffectiveDbProvider|Condition=.*PostgreSql|Condition=.*SqlServer' \
              "$project" \
              --include='*.csproj' \
              --include='*.props'; then
              exit 1
            fi
          }

          assert_no_authoring_conditions /tmp/cleanapi-template-validation/postgresql "PostgreSQL output"
          assert_no_authoring_conditions /tmp/cleanapi-template-validation/sqlserver "SQL Server output"

      - name: Validate wrong-provider packages are absent
        shell: bash
        run: |
          set -euo pipefail

          assert_no_wrong_provider_packages() {
            local project="$1"
            local label="$2"
            local pattern="$3"

            echo "Checking $label"

            if grep -RInE "$pattern" \
              "$project" \
              --include='*.csproj' \
              --include='*.props'; then
              exit 1
            fi
          }

          assert_no_wrong_provider_packages \
            /tmp/cleanapi-template-validation/postgresql \
            "PostgreSQL output" \
            'Aspire\.Hosting\.SqlServer|Microsoft\.Data\.SqlClient|Microsoft\.EntityFrameworkCore\.SqlServer|Testcontainers\.MsSql'

          assert_no_wrong_provider_packages \
            /tmp/cleanapi-template-validation/sqlserver \
            "SQL Server output" \
            'Aspire\.Hosting\.PostgreSQL|Npgsql|Testcontainers\.PostgreSql'

  validate-auth-materialization:
    name: Validate auth materialization
    runs-on: ubuntu-latest

    env:
      OUTPUT_ROOT: /tmp/auth-apphost-validation
      NONE_PROJECT: /tmp/auth-apphost-validation/none
      KEYCLOAK_PROJECT: /tmp/auth-apphost-validation/keycloak

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build raw template content
        run: dotnet build content

      - name: Install template
        run: dotnet new install ./content --force

      - name: Materialize no-auth template
        run: dotnet new cleanapi -n Auth.AppHost.None --auth None -o "$NONE_PROJECT" --force

      - name: Materialize Keycloak template
        run: dotnet new cleanapi -n Auth.AppHost.Keycloak --auth Keycloak -o "$KEYCLOAK_PROJECT" --force

      - name: Verify no-auth excludes auth artifacts
        shell: bash
        run: |
          set -euo pipefail

          test ! -d "$NONE_PROJECT/infra"
          test ! -f "$NONE_PROJECT/src/Auth.AppHost.None.Api/ApiAdapterServiceModule.cs"
          test ! -f "$NONE_PROJECT/src/Auth.AppHost.None.Application/Abstractions/Security/ICurrentUser.cs"
          test ! -f "$NONE_PROJECT/src/Auth.AppHost.None.Api/CurrentUser/HttpCurrentUser.cs"
          test ! -f "$NONE_PROJECT/src/Auth.AppHost.None.Api/Options/AuthenticationOptions.cs"
          test ! -f "$NONE_PROJECT/src/Auth.AppHost.None.Api/Security/AuthenticationExtensions.cs"
          test ! -f "$NONE_PROJECT/src/Auth.AppHost.None.Api/Security/TemplatePolicies.cs"
          test ! -f "$NONE_PROJECT/src/Auth.AppHost.None.Api/OpenApi/OAuth2SecuritySchemeTransformer.cs"

      - name: Verify no-auth has no Keycloak leftovers
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE 'Keycloak|keycloak|StartKeycloak|__KEYCLOAK|__AUTH_AUDIENCE__|Authentication__' \
            "$NONE_PROJECT/src/aspire/Auth.AppHost.None.AppHost"; then
            echo "ERROR: no-auth AppHost contains Keycloak/Auth leftovers."
            exit 1
          fi

      - name: Verify Keycloak includes auth artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -f "$KEYCLOAK_PROJECT/infra/keycloak/realms/auth-apphost-keycloak-realm.json"
          test -f "$KEYCLOAK_PROJECT/src/Auth.AppHost.Keycloak.Api/ApiAdapterServiceModule.cs"
          test -f "$KEYCLOAK_PROJECT/src/Auth.AppHost.Keycloak.Application/Abstractions/Security/ICurrentUser.cs"
          test -f "$KEYCLOAK_PROJECT/src/Auth.AppHost.Keycloak.Api/CurrentUser/HttpCurrentUser.cs"
          test -f "$KEYCLOAK_PROJECT/src/Auth.AppHost.Keycloak.Api/Options/AuthenticationOptions.cs"
          test -f "$KEYCLOAK_PROJECT/src/Auth.AppHost.Keycloak.Api/Security/AuthenticationExtensions.cs"
          test -f "$KEYCLOAK_PROJECT/src/Auth.AppHost.Keycloak.Api/Security/TemplatePolicies.cs"
          test -f "$KEYCLOAK_PROJECT/src/Auth.AppHost.Keycloak.Api/OpenApi/OAuth2SecuritySchemeTransformer.cs"

      - name: Verify Keycloak AppHost wiring
        shell: bash
        run: |
          set -euo pipefail

          grep -RInE 'AddTemplateKeycloak|WithTemplateKeycloakAuthentication|Authentication__Authority|Authentication__Audience|auth-apphost-keycloak' \
            "$KEYCLOAK_PROJECT/src/aspire/Auth.AppHost.Keycloak.AppHost" \
            "$KEYCLOAK_PROJECT/infra"

      - name: Verify old auth runtime switches are absent
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE 'StartKeycloak|Authentication__Enabled' \
            "$KEYCLOAK_PROJECT/src/aspire/Auth.AppHost.Keycloak.AppHost" \
            "$KEYCLOAK_PROJECT/infra"; then
            echo "ERROR: old auth runtime switch leftovers found."
            exit 1
          fi

      - name: Verify source variant leftovers are absent
        shell: bash
        run: |
          set -euo pipefail

          if find "$NONE_PROJECT" "$KEYCLOAK_PROJECT" \
            \( -name '*.None.cs' -o -name '*.PostgreSql.cs' -o -name '*.SqlServer.cs' \) \
            -print | grep -q .; then
            echo "ERROR: source variant leftovers found."
            exit 1
          fi

      - name: Build no-auth generated project
        run: dotnet build "$NONE_PROJECT"

      - name: Build Keycloak generated project
        run: dotnet build "$KEYCLOAK_PROJECT"