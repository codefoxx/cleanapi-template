name: Template Materialization

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate-template-materialization:
    name: Validate template materialization
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate provider-clean template output
        run: bash scripts/validate-template-materialization.sh
