name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: content

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Company.Template.slnx /p:EffectiveDbProvider=PostgreSql

      - name: Build
        run: dotnet build Company.Template.slnx --configuration Release --no-restore /p:EffectiveDbProvider=PostgreSql

      - name: Test
        run: dotnet test Company.Template.slnx --configuration Release --no-build /p:EffectiveDbProvider=PostgreSql

  template-test-postgresql:
    name: Template test PostgreSQL
    runs-on: ubuntu-latest

    env:
      TEST_ROOT: /tmp/cleanapi-template-test
      PROJECT_NAME: Acme.Products
      DB_PROVIDER: PostgreSql
      CONFIGURATION: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.0

      - name: Restore template package
        run: dotnet restore template-package/Codefox.CleanApi.Template.csproj

      - name: Pack template
        run: |
          dotnet msbuild template-package/Codefox.CleanApi.Template.csproj \
            /target:Pack \
            /property:Configuration="$CONFIGURATION" \
            /terminalLogger:off \
            /verbosity:minimal

      - name: Install template
        run: |
          dotnet msbuild template-package/Codefox.CleanApi.Template.csproj \
            /target:InstallTemplate \
            /property:Configuration="$CONFIGURATION" \
            /terminalLogger:off \
            /verbosity:minimal

      - name: Create generated project
        run: |
          rm -rf "$TEST_ROOT"
          mkdir -p "$TEST_ROOT"

          cd "$TEST_ROOT"
          dotnet new cleanapi -n "$PROJECT_NAME" --db "$DB_PROVIDER"

      - name: Check unresolved template placeholders
        working-directory: /tmp/cleanapi-template-test/Acme.Products
        run: |
          if grep -R "Company.Template\|__DB_PROVIDER__\|__API_RESOURCE_NAME__\|__DATABASE_RESOURCE_NAME__\|__MIGRATION_SERVICE_RESOURCE_NAME__\|__PGADMIN_RESOURCE_NAME__\|__KEYCLOAK_RESOURCE_NAME__\|__KEYCLOAK_REALM__\|__AUTH_AUDIENCE__" . \
            --exclude-dir=bin \
            --exclude-dir=obj \
            --exclude-dir=.git; then
            echo "ERROR: Unresolved template placeholders found."
            exit 1
          fi

      - name: Verify generated project structure
        working-directory: /tmp/cleanapi-template-test/Acme.Products
        run: |
          test -f "src/aspire/$PROJECT_NAME.MigrationService/$PROJECT_NAME.MigrationService.csproj"

          echo "Provider-specific files:"
          find . -name "*DatabaseProviderConfigurator*.cs" -print
          find . -name "TestDatabase*.cs" -print

      - name: Restore generated project
        working-directory: /tmp/cleanapi-template-test/Acme.Products
        run: dotnet restore

      - name: Create initial EF Core migration
        working-directory: /tmp/cleanapi-template-test/Acme.Products
        env:
          Database__Provider: PostgreSql
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=dummy;Username=dummy;Password=dummy
        run: |
          dotnet ef migrations add InitialCreate \
            --project "src/$PROJECT_NAME.Infrastructure/$PROJECT_NAME.Infrastructure.csproj" \
            --startup-project "src/aspire/$PROJECT_NAME.MigrationService/$PROJECT_NAME.MigrationService.csproj" \
            --context ApplicationDbContext \
            --output-dir Persistence/Migrations

      - name: Clean EF Core design-time build artifacts
        working-directory: /tmp/cleanapi-template-test/Acme.Products
        run: |
          find . -type d -name "BuildHost-*" -prune -exec rm -rf {} +

      - name: Verify migration files
        working-directory: /tmp/cleanapi-template-test/Acme.Products
        run: |
          if ! find "src/$PROJECT_NAME.Infrastructure/Persistence/Migrations" -name "*InitialCreate*.cs" | grep -q .; then
            echo "ERROR: InitialCreate migration was not created."
            exit 1
          fi

          if ! find "src/$PROJECT_NAME.Infrastructure/Persistence/Migrations" -name "*ModelSnapshot.cs" | grep -q .; then
            echo "ERROR: EF Core model snapshot was not created."
            exit 1
          fi

      - name: Verify no build host artifacts
        working-directory: /tmp/cleanapi-template-test/Acme.Products
        run: |
          if find . -type d -name "BuildHost-*" -print | grep -q .; then
            echo "ERROR: BuildHost artifacts found."
            exit 1
          fi

      - name: Build generated project
        working-directory: /tmp/cleanapi-template-test/Acme.Products
        run: dotnet build --no-restore

      - name: Test generated project
        working-directory: /tmp/cleanapi-template-test/Acme.Products
        run: dotnet test --no-build
